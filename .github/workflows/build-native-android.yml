name: Build Kasirku Native APK

on:
  workflow_dispatch:
  pull_request:
    branches:
      - native-android-foundation
    paths:
      - "android-native/**"
      - ".github/workflows/build-native-android.yml"
  push:
    branches:
      - native-android-foundation
      - native-room-foundation
    paths:
      - "android-native/**"
      - ".github/workflows/build-native-android.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: platform-tools

      - name: Install Android platform and build tools
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build debug APK
        run: gradle -p android-native assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: kasirku-native-debug
          path: android-native/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
