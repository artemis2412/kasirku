name: Build KASIRKU Android APK

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install dependencies
        run: npm install

      - name: Generate app icon and splash assets
        run: npm run prepare:android-assets

      - name: Prepare local web app
        shell: bash
        run: |
          mkdir -p www
          while IFS= read -r -d '' file; do
            mkdir -p "www/$(dirname "$file")"
            cp "$file" "www/$file"
          done < <(git ls-files -z)
          mkdir -p www/icons
          cp icons/icon-192.png icons/icon-512.png www/icons/

      - name: Add Android platform
        run: npx cap add android

      - name: Set release version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i -E "s/versionName \\"[^\\"]+\\"/versionName \\"$VERSION\\"/" android/app/build.gradle
          sed -i -E "s/CURRENT_VERSION = \\"[^\\"]+\\"/CURRENT_VERSION = \\"$VERSION\\"/" www/update-checker.js
      - name: Sync web app
        run: npx cap sync android

      - name: Generate native Android resources
        run: npx capacitor-assets generate --android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: KASIRKU-debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish APK to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: KASIRKU ${{ github.ref_name }}
          files: android/app/build/outputs/apk/debug/app-debug.apk
          generate_release_notes: true
