name: Build KASIRKU Android APK

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Versi aplikasi, contoh 1.0.0"
        required: true
        default: "1.0.0"
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install dependencies
        run: npm install

      - name: Generate app icon and splash assets
        run: npm run prepare:android-assets

      - name: Prepare local web app
        shell: bash
        run: |
          mkdir -p www
          while IFS= read -r -d '' file; do
            mkdir -p "www/$(dirname "$file")"
            cp "$file" "www/$file"
          done < <(git ls-files -z)
          mkdir -p www/icons
          cp icons/icon-192.png icons/icon-512.png www/icons/

      - name: Add Android platform
        run: npx cap add android

      - name: Sync web app
        run: npx cap sync android

      - name: Generate native Android resources
        run: npx capacitor-assets generate --android

      - name: Configure permanent APK signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KASIRKU_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KASIRKU_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KASIRKU_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KASIRKU_KEY_PASSWORD }}
          VERSION_NAME: ${{ inputs.version_name }}
          VERSION_CODE: ${{ github.run_number }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64" || (echo "Missing KASIRKU_KEYSTORE_BASE64" && exit 1)
          test -n "$KEYSTORE_PASSWORD" || (echo "Missing KASIRKU_KEYSTORE_PASSWORD" && exit 1)
          test -n "$KEY_ALIAS" || (echo "Missing KASIRKU_KEY_ALIAS" && exit 1)
          test -n "$KEY_PASSWORD" || (echo "Missing KASIRKU_KEY_PASSWORD" && exit 1)
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/kasirku-release.p12
          cat > android/keystore.properties <<EOF
          storeFile=app/kasirku-release.p12
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
          python3 - <<'PY'
          from pathlib import Path
          import os, re
          p = Path("android/app/build.gradle")
          s = p.read_text()
          if "signingConfigs {" in s:
              raise SystemExit("Signing config already exists; refusing to overwrite.")
          signing = """
              signingConfigs {
                  release {
                      def ks = new Properties()
                      file("../keystore.properties").withInputStream { ks.load(it) }
                      storeFile file(ks['storeFile'])
                      storePassword ks['storePassword']
                      keyAlias ks['keyAlias']
                      keyPassword ks['keyPassword']
                  }
              }
          """
          s = re.sub(r"(?m)^\s*buildTypes\s*\{", signing + "\n            buildTypes {", s, count=1)
          if "signingConfigs.release" not in s:
              s = re.sub(r"(?m)^(\s*release\s*\{)", r"\1\n                signingConfig signingConfigs.release", s, count=1)
          version_code = os.environ["VERSION_CODE"]
          version_name = os.environ["VERSION_NAME"]
          s, n1 = re.subn(r"(?m)(^\s*versionCode\s+)\d+", r"\g<1>" + version_code, s, count=1)
          s, n2 = re.subn(r'(?m)(^\s*versionName\s+)[\'"][^\'"]*[\'"]', lambda m: m.group(1) + '"' + version_name + '"', s, count=1)
          if n1 != 1 or n2 != 1:
              raise SystemExit("Could not safely set Android versionCode/versionName.")
          p.write_text(s)
          PY

      - name: Build signed release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Verify APK signature
        run: |
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)/apksigner" verify --verbose android/app/build/outputs/apk/release/app-release.apk

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: KASIRKU-release-APK-${{ inputs.version_name }}-${{ github.run_number }}
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
