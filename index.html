<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#14251f">
  <meta name="description" content="KASIRKU - Sistem kasir warung dan cafe">
  <link rel="manifest" href="./manifest.json">
  <link rel="stylesheet" href="./style.css?v=11.6">
  <title>KASIRKU V4</title>
</head>
<body>
  <aside id="sidebar">
    <div class="brand">KASIRKU<small>WARUNG &amp; CAFE</small></div>
    <div class="branch-label">CABANG AKTIF</div>
    <div class="branch-name">Cabang Utama</div>
    <nav id="nav" aria-label="Navigasi utama"></nav>
    <div class="sidebar-foot"><label class="desktop-toggle"><input type="checkbox" id="desktop-mode-toggle"> <span>Mode Desktop</span></label><div class="brand-credit">Design by -ArTeMiS-</div></div>
  </aside>
  <main>
    <header class="topbar">
      <button id="menu-toggle" class="menu-toggle" aria-label="Buka menu">☰</button>
      <div><div class="eyebrow">SISTEM KASIR</div><h1 id="page-title">Dashboard</h1></div>
      <time id="today-date"></time>
    </header>
    <section id="view" aria-live="polite">
      <div class="loading">Memuat KASIRKU…</div>
    </section>
    <nav id="bottom-nav" aria-label="Navigasi bawah"></nav>
    <div id="connection-status" class="connection-status" role="status" aria-live="polite"><span class="connection-dot" aria-hidden="true"></span><span id="connection-status-label">Memeriksa…</span></div>
  </main>
  <script>if(new URLSearchParams(location.search).has("security-preview")){document.write('<script src="./auth.js?v=4"><\/script>')}</script>
  <script src="./app.js?v=12.3"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js").catch(() => {});
      });
    }
  </script>
</body>
</html>
