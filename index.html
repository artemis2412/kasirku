<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#063d24">
  <meta name="description" content="KASIRKU - Aplikasi Kasir Modern">
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/svg+xml" href="./assets/kasirku-mark.svg?v=4">
  <link rel="apple-touch-icon" href="./assets/kasirku-mark.svg?v=4">
  <link rel="stylesheet" href="./style.css?v=full-brand-logo-2">
  <link rel="stylesheet" href="./mobile-layout-fixes.css?v=bottom-more-popup-2">
  <link rel="stylesheet" href="./mobile-drawer.css?v=2">
  <link rel="stylesheet" href="./welcome.css?v=welcome-logo-refresh-2">
  <title>KASIRKU — Aplikasi Kasir Modern</title>
</head>
<body>
  <aside id="sidebar">
    <div class="brand brand-full"><img class="brand-full-image" src="./assets/kasirku-full-logo.webp?v=1" alt="Logo lengkap KASIRKU"></div>
    <div class="branch-label">CABANG AKTIF</div>
    <div class="branch-name">Cabang Utama</div>
    <nav id="nav" aria-label="Navigasi utama"></nav>
    <div class="sidebar-foot"><label class="desktop-toggle"><input type="checkbox" id="desktop-mode-toggle"> <span>Mode Desktop</span></label><div class="brand-credit">Design by -ArTeMiS-</div></div>
  </aside>
  <button id="sidebar-backdrop" class="sidebar-backdrop" type="button" aria-label="Tutup menu" tabindex="-1"></button>
  <main>
    <header class="topbar">
      <button id="menu-toggle" class="menu-toggle" aria-label="Buka menu">☰</button>
      <div><div class="eyebrow">KASIRKU</div><h1 id="page-title">Dashboard</h1></div>
      <time id="today-date"></time>
    </header>
    <section id="view" aria-live="polite">
      <div class="loading">Memuat KASIRKU…</div>
    </section>
    <nav id="bottom-nav" aria-label="Navigasi bawah"></nav>
    <div id="connection-status" class="connection-status" role="status" aria-live="polite"><span class="connection-dot" aria-hidden="true"></span><span id="connection-status-label">Memeriksa…</span></div>
  </main>
  <script src="./auth.js?v=welcome-logo-refresh-2"></script>
  <script src="./supabase-config.js?v=1"></script>
  <script src="./cloud-session.js?v=idle-session-10m-1"></script>
  <script src="./cloud-bridge.js?v=admin-branch-access-1"></script>
  <script>
    if (new URLSearchParams(location.search).has("cloud-auth-preview")) {
      const configScript = document.createElement("script");
      configScript.src = "./supabase-config.js?v=1";
      configScript.onload = () => {
        const authScript = document.createElement("script");
        authScript.src = "./cloud-auth.js?v=standalone-cloud-login-1";
        document.body.appendChild(authScript);
      };
      configScript.onerror = () => console.error("KASIRKU: gagal memuat konfigurasi login cloud.");
      document.body.appendChild(configScript);
    }
  </script>
  <script src="./branch-storage.js?v=1"></script>
  <script src="./app.js?v=settings-icon-fix-1"></script>
  <script src="./cloud-panel.js?v=admin-branch-access-2"></script>
  <script src="./cloud-catalog-sync.js?v=2"></script>
  <script src="./update-checker.js?v=1"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js").catch(() => {});
      });
    }
  </script>
</body>
</html>
